known_risks:
  - >-
    Mandatory hosted CI is still pending for the exact handoff-only child. Local success cannot
    replace the four required hosted conclusions, immutable run identities, and artifact checksums.
  - >-
    Dependency Review remains externally blocked until the repository owner enables Dependency
    Graph and the required GitHub Advanced Security capability.
  - >-
    CodeQL upload remains externally blocked until the repository owner enables code scanning/GitHub
    Advanced Security and the workflow token integration can access the code-scanning endpoints.
    The delivery grants the CodeQL job only actions: read, contents: read, and security-events: write.
  - >-
    SBOM generators omit license metadata for 182 components on the recorded Darwin environment;
    the failed old Linux run reported 183. Local direct/tool review passes, but hosted Dependency
    Review is required before acceptance.
  - Dependency advisory databases are mutable external inputs; the local 2026-08-30 result cannot establish permanent absence of future advisories.
  - The local deterministic secret scanner and engineering license deny-list complement but do not replace repository-host scanning or final legal review.
