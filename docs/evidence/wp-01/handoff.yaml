known_risks:
  - >-
    Mandatory exact-handoff hosted CI is pending: no green quality run, Dependency Review
    license evaluation, CodeQL upload, Linux Trivy result, hosted reproducibility artifact,
    immutable run URL/ID, or hosted artifact checksum exists yet.
  - SBOM generators omit license metadata for 182 transitive or platform components; local direct/tool review passes, but hosted Dependency Review is required before acceptance.
  - Dependency advisory databases are mutable external inputs; local audits record the 2026-08-30 result and cannot establish permanent absence of future advisories.
  - Runtime HTTP header and process-log hashes include observational timing/path data; only the full deterministic double-build generated tree and archive hashes support reproducibility.
  - setup-uv is commit-pinned and requests uv 0.12.7, but the workflow relies on the pinned action's upstream binary verification rather than a second repository copy of that metadata.
  - The deterministic secret scanner and engineering license deny-list complement but do not replace hosted secret scanning or final legal review.
