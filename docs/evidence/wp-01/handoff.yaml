local_runtime_evidence:
  status: passed
  rationale: >-
    WP-01 owns one runnable behavior: the frozen-lock Next.js production foundation shell,
    which passed start, page and client-asset readiness, SIGINT shutdown, and no-listener checks.
    Python services are import-only empty boundaries with no ASGI or worker entry point. A real
    offline agent/API/stream is owned by WP-03, WP-05, and WP-06; real UI is owned by WP-05;
    later renderer, map/temporal, and export suites are owned by WP-08, WP-09, and WP-12.
  subgates:
    frozen_lock_start_health_shutdown: passed
    offline_agent_api_and_stream: not_applicable
    wp_05_plus_real_ui: not_applicable
    later_package_suite_extension: not_applicable
  frozen_lock_start_commands:
    - >-
      NEXT_TELEMETRY_DISABLED=1 NEXT_BUILD_ID=wp01-runtime-correction-v2
      corepack pnpm --filter @visualization-agent/web build
    - >-
      COREPACK_HOME=/private/tmp/wp01-node.2MWnTu/corepack HOSTNAME=127.0.0.1
      PORT=34101 corepack pnpm --filter @visualization-agent/web start
    - >-
      .venv/bin/python -c 'import visualization_agent_api,
      visualization_agent_worker_analysis, visualization_agent_worker_export'
  health_readiness_checks:
    - HTTP GET http://127.0.0.1:34101/ returned HTTP/1.1 200 OK, text/html, 4,673 bytes, and the expected Visualization Agent heading.
    - HTTP GET of the generated client chunk returned HTTP/1.1 200 OK and 16,891 bytes with sha256:6b1d5556b9a152c3cda207b3c932c8b4018b0a83da91e911d32aba98a60c9502.
    - The exact-delivery rerun reproduced the committed page, client asset, and semantic trace hashes; the page hash remains runtime-observation evidence, not reproducible-build proof.
    - External dependency-failure behavior is not applicable because WP-01 owns no configured database, cache, object store, API, queue, provider, or worker dependency.
  graceful_shutdown_checks:
    - SIGINT produced process exit 130 without forced kill, and TCP port 34101 had no remaining listener.
    - Python boundary imports completed with exit 0 and left no process or port.
  agent_api_stream_traces:
    - >-
      A real API/agent stream is not applicable: WP-03 owns API/state, WP-05 owns the first
      real streaming UI, and WP-06 owns logical agents. Offline exact adapter fixtures remain
      under tests/compatibility/fixtures and pass the Pydantic AI to AI SDK compatibility tests.
  ui_e2e_artifacts:
    - Real-browser product E2E is not applicable before WP-05 because WP-01 owns no interactive product behavior; the owned production shell was exercised over loopback HTTP.
  dataset_result_artifact_hashes:
    - docs/evidence/wp-01/runtime/page-body.html#sha256:25024df12beb9ec369aa315314bb70343db71ef56f9974dc307e5b83fd55c691
    - docs/evidence/wp-01/runtime/client-asset.js#sha256:6b1d5556b9a152c3cda207b3c932c8b4018b0a83da91e911d32aba98a60c9502
    - docs/evidence/wp-01/runtime/trace.json#sha256:dc2b40b672d34118725f8fbb363cd3e0071d7b14a7eac239145b6be3ecf224bf
    - docs/evidence/wp-01/runtime/startup-shutdown.log#sha256:baf049408072288ca17ea56761aadb79e3ca7879a79c5f66b6bd87283c07f853
    - docs/evidence/wp-01/runtime/checksums.sha256#sha256:5e17fa1ee366d7ae4490694aadf25e899121fd6cc82a47a9fcac0c3227d8283f
  failures_and_retests:
    - The original standalone client-asset HTTP 404 and its successful packaging correction are preserved in docs/evidence/wp-01/runtime/failure-retest.yaml.
    - The exact-delivery sandboxed runtime attempt failed loopback bind with EPERM; the approved narrow-permission retest passed both HTTP probes, graceful SIGINT shutdown, and no-listener verification.
