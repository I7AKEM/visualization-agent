historical_repository_setting_observation:
  pr_1: Dependency Review and CodeQL publication were unavailable on PR #1.
  pr_2: >-
    Both capabilities executed on PR #2. Dependency Review failed on a real advisory and CodeQL
    published an exact-head zero-result analysis, so the PR #1 setting claims are no longer current
    blockers.
workflow_correction:
  package_manager_execution: >-
    Every hosted entry point and every nested root workspace script now invokes pnpm as
    `corepack pnpm`. Deterministic policy tests trace the workflow-to-script execution graph,
    exercise positive and negative command forms, and fail if an active hosted path again
    requires a globally installed bare pnpm executable.
  codeql_job_permissions: >-
    The correction grants only `actions: read` in addition to the existing `contents: read` and
    `security-events: write`, so CodeQL can read its workflow-run context. PR #2 confirms that the
    exact-head analysis published successfully; this workflow does not itself enable or bypass
    GitHub Advanced Security.
  dependency_advisory: >-
    The root manifest now carries only the two reviewed parent-scoped pnpm overrides needed to
    resolve the @cyclonedx/cdxgen 12.8.4 and cheerio 1.2.0 undici edges at patched 7.29.0. Static
    lock policy rejects any undici 7.x below 7.29.0 or 8.x below 8.9.0, and the hosted Node job
    audits the complete lock including development toolchains.
  trivy_license_completeness: >-
    The Trivy job now installs both exact frozen dependency environments before scanning. Its
    HIGH/CRITICAL vulnerability, secret, and misconfiguration policy scan is separate from an
    all-severity rootfs license-evidence scan; the latter retains every LGPL/unknown record and a
    fail-closed validator rejects zero or partial Node/Python coverage and the committed
    AGPL/GPL/SSPL deny policy before upload.
local_state:
  correction_verification: passed_precommit_exact_delivery_retest_pending
  no_global_pnpm_shim: true
  package_manager_path_proof: >-
    The reproducibility PATH contained the pinned Node/Corepack and uv toolchains plus system
    binaries, but no standalone pnpm executable; all nested pnpm calls still passed.
  focused_dependency_and_trivy_tests: 11 passed
  complete_ci_policy_tests: 52 passed
  double_clean_build: >-
    Two distinct clean frozen-lock workspaces produced 1,359 byte-identical generated files
    and sha256:32ab0d78c38ddf6fde14e631752a5335f6643da50c602d12f866135d50f8862d.
  standalone_runtime: >-
    The generated server returned HTTP 200 for the page and referenced client asset, exited 130
