  nonfatal_observations:
    - >-
      CodeQL warned that `refs/remotes/pull/1/merge` was absent because the workflow deliberately
      checked out the exact PR head rather than GitHub's synthetic merge ref; extraction and query
      execution still completed before the externally blocked upload.
    - >-
      Dependency Review action v4.8.3 warned that its Node 20 action runtime was deprecated and
      forced to Node 24. The warning was not the job failure; any action upgrade requires a newly
      reviewed immutable SHA.
external_repository_setting_blockers:
  - Dependency Review remains unavailable until the repository owner enables Dependency Graph and the required GitHub Advanced Security capability.
  - CodeQL result upload remains unavailable until the repository owner enables code scanning/GitHub Advanced Security and the workflow token integration can access the required code-scanning endpoints.
workflow_correction:
  package_manager_execution: >-
    Every hosted entry point and every nested root workspace script now invokes pnpm as
    `corepack pnpm`. Deterministic policy tests trace the workflow-to-script execution graph,
    exercise positive and negative command forms, and fail if an active hosted path again
    requires a globally installed bare pnpm executable.
  codeql_job_permissions: >-
    The correction grants only `actions: read` in addition to the existing `contents: read` and
    `security-events: write`, so CodeQL can read its workflow-run context after the owner enables
    code scanning. It does not enable or bypass GitHub Advanced Security.
local_state:
  correction_verification: passed
  no_global_pnpm_shim_path: /private/tmp/wp01-hosted-correction-bin
  focused_execution_policy_tests: 9 passed
  complete_ci_policy_tests: 41 passed
  double_clean_build: >-
    Two distinct clean frozen-lock workspaces produced 1,359 byte-identical generated files
    and sha256:1c1954ef469df03b098ea37b30265e77d6bfc5436f7d4fe2c0ce9d0bcfa43361.
  standalone_runtime: >-
    The generated server returned HTTP 200 for the page and referenced client asset, exited 130
    after SIGINT, and left no listener.
  push_performed: false
  workflow_dispatch_performed: false
  reason: >-
    This correction task only inspected the immutable old hosted runs. It did not push, update the
    pull request, dispatch workflows, or change repository settings; those actions remain excluded.
repository_local_package_manager:
  version_source: package.json packageManager pnpm@10.34.5
  invocation: corepack pnpm
  ci_cache: ${{ github.workspace }}/.corepack
  global_shim_mutation: false
  corepack_enable_used: false
acceptance_rule: >-
  A local pass or a generated run-context manifest is not a green hosted result. Integration
  must verify all four GitHub run conclusions, URLs/IDs, exact SHA equality, and uploaded
  artifact/checksum references before accepting WP-01 as dependency evidence.
