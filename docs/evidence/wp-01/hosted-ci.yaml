schema_version: 1
record_type: wp_01_hosted_ci_requirement
work_package: WP-01
status: immutable_pr_2_failed_correction_local_precommit_passed_exact_delivery_and_hosted_reruns_pending
acceptance_blocked: true
production_approved: false
exact_ref_rule: >-
  All required hosted workflows must conclude success for the exact corrected handoff commit.
  Every job explicitly checks out WP01_TESTED_SHA. For pull_request this is the PR head SHA,
  not GitHub's synthetic merge SHA; the manifest records both event_sha and checkout_sha and
  fails unless git rev-parse HEAD equals tested_sha. The integration owner records the exact
  corrected handoff commit after the handoff-only commit exists.
required_workflows:
  - gate: quality
    manifest_artifact: wp-01-quality-run-<run-id>-<attempt>-<sha>
    required_fields: [run_id, run_attempt, run_url, exact_sha, checkout_sha, event_sha, artifact_references]
  - gate: security
    manifest_artifact: wp-01-security-run-<run-id>-<attempt>-<sha>
    required_fields: [run_id, run_attempt, run_url, exact_sha, checkout_sha, event_sha, artifact_references]
  - gate: dependency-review
    manifest_artifact: wp-01-dependency-review-run-<run-id>-<attempt>-<sha>
    trigger: pull_request_with_corrected_handoff_as_pr_head
    required_fields: [run_id, run_attempt, run_url, exact_sha, checkout_sha, event_sha, pull_request_head_sha, pull_request_base_sha, artifact_references]
  - gate: reproducibility
    manifest_artifact: wp-01-sbom-reproducibility-<run-id>-<attempt>-<sha>
    required_fields: [run_id, run_attempt, run_url, exact_sha, checkout_sha, event_sha, artifact_references]
required_artifacts:
  - quality hosted run context
  - security hosted run context, Trivy JSON, and CodeQL category reference
  - dependency-review hosted run context
  - reproducibility hosted run context, SBOM checksums, two-build provenance, generated manifests, and normalized archives
