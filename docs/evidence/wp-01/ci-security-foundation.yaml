ci_gates:
  quality:
    workflow: .github/workflows/quality.yml
    covers:
      - formatting
      - lint
      - strict_types
      - schema_and_evidence_relationships
      - unit_property_contract_component_foundations
      - adapter_compatibility_foundations
      - production_build
      - frozen_lock_integrity
      - real_model_request_block
  security:
    workflow: .github/workflows/security.yml
    covers:
      - tracked_and_history_secret_patterns
      - bandit_sast
      - pip_audit
      - pnpm_production_audit
      - pnpm_complete_lock_audit_including_development_toolchains
      - checksum_verified_trivy_vulnerability_secret_and_misconfiguration_scan
      - complete_installed_node_and_python_trivy_license_evidence
      - fail_closed_nonempty_ecosystem_license_assertions
      - codeql_python_javascript_typescript
  dependency_review:
    workflow: .github/workflows/dependency-review.yml
    covers:
      - added_dependency_advisories
      - added_dependency_licenses
  reproducibility:
    workflow: .github/workflows/reproducibility.yml
    covers:
      - frozen_uv_and_pnpm_install
      - foundation_builds
      - cyclonedx_node_and_python_sboms
      - sbom_structure_version_and_direct_tool_license_validation
      - sha256_evidence
      - twice_built_byte_identical_normalized_foundation_artifact
supply_chain_controls:
  action_lock: infra/dev/ci-tools.lock.json
  action_reference_policy: reviewed 40-hex Git commit only
  runner_policy: ubuntu-24.04 only; floating latest labels rejected
  dependency_policy: exact declarations plus committed pnpm and uv locks
  advisory_override_policy: >-
    Only the reviewed @cyclonedx/cdxgen 12.8.4 and cheerio 1.2.0 parent edges override undici to
    patched 7.29.0. Static policy rejects override drift and any resolved 7.x below 7.29.0 or 8.x
    below 8.9.0; suppression and advisory ignores are forbidden.
  package_manager_policy: >-
    pnpm 10.34.5 from package.json is invoked as corepack pnpm with COREPACK_HOME inside
    the checkout; corepack enable/global shim mutation and root npm/yarn locks are rejected
  global_install_policy: forbidden
  mutable_container_policy: forbidden
  preserved_poc_scan_policy: >-
    Secret/history scanning includes the preserved POC. Production dependency/SAST scans
    exclude agent, demos, ui, out, and the frozen legacy package-lock because WP-00 records
    them as prohibited production paths rather than WP-01 production dependencies.
  excluded_tools:
    - tool: aquasecurity/trivy-action
      reason: >-
        The wrapper action is not admitted after GHSA-69fq-xp46-6x23. CI downloads
        the immutable Trivy v0.73.0 Linux asset directly into /tmp and verifies its
        committed SHA-256 before execution; it is never installed globally.
      source: https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23
model_request_control:
  normal_ci_allows_live_models: false
  mechanism:
    - Pydantic AI ALLOW_MODEL_REQUESTS is forced false through CI sitecustomize.
    - Provider credential names are absent from ordinary workflows and checked at runtime.
    - No eval/live-provider workflow is enabled by WP-01.
schemas:
  - path: schemas/handoff-v1.schema.json
    validator: scripts/ci/validate_evidence.py
  - path: schemas/integration-acceptance-v1.schema.json
    validator: scripts/ci/validate_evidence.py
git_relationships_validated:
  - base integration commit is an ancestor of delivery commit
  - delivery diff equals ordered changed_paths
  - handoff commit is the direct child of delivery and changes only handoff.yaml
  - accepted handoff anchors match its acceptance record
  - acceptance record introduction parent equals acceptance_base_commit
  - specification commit contains all seven normative documents
