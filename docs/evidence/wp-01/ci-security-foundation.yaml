known_risks:
  - The local secret scanner is deterministic and conservative but does not replace the repository host's secret-scanning service.
  - The license deny list is a conservative engineering gate, not final legal approval.
  - Dependency vulnerability databases are mutable external inputs; CI reports are reproducible only with their recorded run timestamp and database state.
  - GitHub-hosted action execution still trusts GitHub and the pinned upstream commit ancestry; a 40-hex reference alone is not an attestation.
  - setup-uv is commit-pinned and requests exact uv 0.12.7, but the workflow does not maintain a second repository copy of setup-uv's upstream binary checksum verification metadata.
  - >-
    Local passes do not waive the mandatory exact-handoff hosted CI gate. No run URL/ID,
    conclusion, CodeQL upload, Dependency Review license result, or Linux Trivy artifact is claimed.
rollback_steps:
  - Remove the four WP-01 workflow files to stop CI execution without changing runtime code.
  - Remove scripts/ci, the two schemas, infra/dev, SECURITY.md, REPRODUCIBILITY.md, and this evidence fragment to withdraw the foundation policy.
  - Do not alter Node/Python manifests or preserved POC files as part of this rollback.
