tests_not_run:
  - >-
    Green hosted quality, GitHub dependency review/license evaluation, CodeQL upload, and Linux
    Trivy runs for the exact corrected handoff commit require an external push/PR/dispatch. Those
    actions remain excluded, so WP-01 acceptance and use as dependency evidence are blocked.
  - A clean-room cross-host/container rebuild, signed provenance/attestation, and image scan are WP-14 release gates and are not claimed.
  - No production container image exists in WP-01, so Trivy scans the repository filesystem and misconfiguration sources; promoted-image scanning remains a later gate.
