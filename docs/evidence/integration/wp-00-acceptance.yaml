.sort==owners.sort; raise "acceptance disabled mismatch" unless a.fetch("disabled_features").sort==features.map{|x|x.fetch("id")}.sort && assignment.fetch("disabled_features").sort==features.map{|x|x.fetch("id")}.sort; raise "production approval" unless a.fetch("production_approved")==false && assignment.fetch("production_approved")==false; puts "PASS #{files.length} YAML files, scoped WP-01 assignment, #{owners.length} globally unresolved owner inputs, #{features.length} disabled features, #{reqs.length} requirements"'
