schema_version: 1
record_id: WP00-RETENTION
status: input_required
normative_sources:
  - docs/production-spec/01_DECISIONS_AND_ARCHITECTURE.md#5
  - docs/production-spec/02_CONTRACTS_AND_STATE_MACHINES.md#3
  - docs/production-spec/02_CONTRACTS_AND_STATE_MACHINES.md#11
  - docs/production-spec/05_SECURITY_OPERATIONS_AND_DELIVERY.md#2.3
fixed_rules:
  - Retention class is mandatory on every object record.
  - Soft deletion/tombstone is distinct from retention purge.
  - Legal hold, deletion, backup, and audit behavior must be policy-owned.
  - Idempotency records live at least as long as the maximum client retry, export, and job window.
  - Interactive clarification timeout defaults to 24 hours unless policy configures another value; timeout is not a storage-retention period.
  - Signed URLs use the shortest practical expiry; exact duration remains configuration input.
