name: WP-01 reproducibility and SBOM

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_HOME: ${{ github.workspace }}/.corepack
  NEXT_TELEMETRY_DISABLED: "1"
  ALLOW_MODEL_REQUESTS: "false"
  PYDANTIC_AI_ALLOW_MODEL_REQUESTS: "false"
  PYTHONPATH: ${{ github.workspace }}/scripts/ci/model_block
  SOURCE_DATE_EPOCH: "315532800"
  WP01_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WP01_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  WP01_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  build-sbom-checksum:
    name: Frozen builds, CycloneDX SBOMs, reproducible artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      - name: Set up locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
      - name: Resolve repository-pinned pnpm in the repository-local Corepack home
        run: corepack pnpm --version
      - name: Frozen dependency environments
        run: |
          uv sync --frozen --all-groups --all-packages
          corepack pnpm install --frozen-lockfile
      - name: Generate Node CycloneDX SBOM
        run: corepack pnpm sbom
      - name: Generate Python CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment
          --output-format JSON
          --output-file artifacts/sbom/python.cdx.json
      - name: Normalize SBOM generator randomness
        run: >-
          uv run python scripts/ci/normalize_sbom.py
          artifacts/sbom/node.cdx.json
          artifacts/sbom/python.cdx.json
      - name: Validate and checksum SBOMs
        run: >-
          uv run python scripts/ci/validate_sbom.py
          artifacts/sbom/node.cdx.json
          artifacts/sbom/python.cdx.json
          --summary artifacts/sbom/checksums.json
      - name: Validate complete dependency license metadata
        run: >-
          uv run python scripts/ci/validate_licenses.py
          artifacts/sbom/node.cdx.json
          artifacts/sbom/python.cdx.json
      - name: Run two independent clean frozen-lock builds and compare complete outputs
        run: scripts/ci/reproducible_foundation.sh
      - name: Write exact hosted reproducibility run context
        run: >-
          python3 scripts/ci/write_hosted_run_manifest.py
          --gate reproducibility
          --tested-sha ${{ env.WP01_TESTED_SHA }}
          --output artifacts/hosted-ci/reproducibility.json
          --artifact-reference wp-01-sbom-reproducibility-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.WP01_TESTED_SHA }}
      - name: Upload checksummed evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp-01-sbom-reproducibility-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.WP01_TESTED_SHA }}
          path: |
            artifacts/sbom/
            artifacts/reproducibility/
            artifacts/hosted-ci/reproducibility.json
          if-no-files-found: error
          retention-days: 30
