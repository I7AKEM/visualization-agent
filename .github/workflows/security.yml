name: WP-01 security gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  COREPACK_HOME: ${{ github.workspace }}/.corepack
  NEXT_TELEMETRY_DISABLED: "1"
  ALLOW_MODEL_REQUESTS: "false"
  PYDANTIC_AI_ALLOW_MODEL_REQUESTS: "false"
  PYTHONPATH: ${{ github.workspace }}/scripts/ci/model_block
  WP01_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  WP01_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  WP01_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  repository-secrets:
    name: Repository and history secret patterns
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Scan tracked files and Git patches
        run: python3 scripts/ci/scan_secrets.py --history

  python-security:
    name: Python SAST and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
      - name: Set up locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Frozen Python environment
        run: uv sync --frozen --all-groups --all-packages
      - name: Prove real model requests are blocked
        run: uv run python scripts/ci/assert_model_block.py
      - name: Bandit SAST
        run: uv run bandit -q -r services packages
      - name: Locked dependency vulnerability audit
        run: scripts/ci/audit_python_lock.sh

  node-security:
    name: Node production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Set up Node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
      - name: Resolve repository-pinned pnpm in the repository-local Corepack home
        run: corepack pnpm --version
      - name: Frozen Node environment
        run: corepack pnpm install --frozen-lockfile
      - name: Production dependency vulnerability audit
        run: corepack pnpm audit:prod

  trivy-filesystem:
    name: Trivy vulnerability, secret, license, and misconfiguration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Install checksum-verified Trivy locally
        run: python3 scripts/ci/install_ci_tool.py trivy --output-dir /tmp/wp01-ci-tools
      - name: Scan repository filesystem
        run: |
          mkdir -p artifacts/security
          /tmp/wp01-ci-tools/trivy filesystem \
            --scanners vuln,misconfig,secret,license \
            --severity HIGH,CRITICAL \
            --skip-files package-lock.json \
            --skip-dirs agent \
            --skip-dirs demos \
            --skip-dirs ui \
            --skip-dirs out \
            --skip-dirs docs/evidence/wp-01/fixtures/legacy-poc \
            --exit-code 1 \
            --format json \
            --output artifacts/security/trivy.json \
            .
      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp-01-trivy-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.WP01_TESTED_SHA }}
          path: artifacts/security/trivy.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL Python and JavaScript/TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript,python
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:foundation

  hosted-evidence:
    name: Record exact hosted security run context
    needs: [repository-secrets, python-security, node-security, trivy-filesystem, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ env.WP01_TESTED_SHA }}
      - name: Write run identity after all security jobs pass
        run: >-
          python3 scripts/ci/write_hosted_run_manifest.py
          --gate security
          --tested-sha ${{ env.WP01_TESTED_SHA }}
          --output artifacts/hosted-ci/security.json
          --artifact-reference wp-01-security-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.WP01_TESTED_SHA }}
          --artifact-reference wp-01-trivy-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.WP01_TESTED_SHA }}
          --artifact-reference codeql-category:/language:foundation
      - name: Upload immutable run context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp-01-security-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.WP01_TESTED_SHA }}
          path: artifacts/hosted-ci/security.json
          if-no-files-found: error
          retention-days: 30
