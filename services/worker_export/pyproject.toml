[project]
name = "visualization-agent-worker-export"
version = "0.0.0"
description = "Empty export worker scaffold; export is not enabled by WP-01."
requires-python = "==3.12.*"
dependencies = [
  "logfire==4.41.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualization_agent_worker_export"]
