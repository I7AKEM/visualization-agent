[project]
name = "visualization-agent-api"
version = "0.0.0"
description = "Empty API service scaffold; product routes are not enabled by WP-01."
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.141.1",
  "logfire==4.41.0",
  "pydantic==2.13.5",
  "pydantic-ai-slim[anthropic,mcp,openai,ui]==2.36.0",
  "pydantic-settings==2.15.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visualization_agent_api"]
